name: Sincronizar Instagram

on:
  schedule:
    - cron: "0 11 * * *" # 8:00 hora Argentina (UTC-3), todos los dias
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo (rama gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar Instagram y actualizar data.js
        env:
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
        run: python automation/sync_instagram.py

      - name: Traer rendimiento diario (Instagram + Facebook)
        env:
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
        run: python automation/fetch_performance.py

      - name: Commitear y subir cambios (si los hay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "Sin novedades hoy."
          else
            git commit -m "Sincronizar publicaciones de Instagram [automatico]"
            git push origin gh-pages
          fi
