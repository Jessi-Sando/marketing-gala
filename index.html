<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gala SA — Campaña Q3 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=17" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="assets/logos/gala-sa.png" alt="Gala SA" class="brand__logo" /></div>
    <div class="period">Campaña Q3 2026 · Junio – Septiembre</div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Unidades de negocio"></nav>

  <main id="content"></main>

  <footer class="site-footer">
    <span>Uso interno · Gala SA</span>
  </footer>

  <div id="panel-modal" class="panel-modal" hidden>
    <div class="panel-modal__backdrop" data-close></div>
    <div class="panel-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="panel-modal-title">
      <button type="button" class="panel-modal__close" data-close aria-label="Cerrar">✕</button>
      <h3 class="panel-modal__title" id="panel-modal-title"></h3>
      <p class="panel-modal__subtitle" id="panel-modal-subtitle"></p>

      <label class="panel-field">
        <span>Copy</span>
        <textarea id="panel-copy" rows="4" placeholder="Texto del caption..."></textarea>
      </label>

      <div class="panel-field">
        <span>Enlace de Drive (piezas gráficas)</span>
        <div class="panel-drive-row">
          <input type="url" id="panel-drive" placeholder="https://drive.google.com/..." />
          <a href="#" id="panel-drive-open" class="panel-drive-open" target="_blank" rel="noopener noreferrer" hidden>Abrir ↗</a>
        </div>
      </div>

      <div class="panel-field">
        <span>Lista de tareas</span>
        <ul id="panel-tasks" class="panel-tasks"></ul>
        <div class="panel-tasks__add">
          <input type="text" id="panel-task-input" placeholder="Nueva tarea..." />
          <button type="button" id="panel-task-add" class="panel-btn">+ Agregar</button>
        </div>
      </div>

      <div class="panel-checks">
        <label><input type="checkbox" id="panel-terminado" /> Terminado</label>
        <label><input type="checkbox" id="panel-publicado" /> Publicado</label>
        <label><input type="checkbox" id="panel-pautado" /> Pautado</label>
      </div>

      <label class="panel-field">
        <span>Sugerencia de historia</span>
        <textarea id="panel-sugerencia" rows="3" placeholder="Idea para historia..."></textarea>
      </label>

      <div class="panel-modal__actions">
        <span class="panel-modal__hint">Se guarda en la nube · lo ve todo el equipo en tiempo real</span>
        <button type="button" id="panel-save" class="panel-btn panel-btn--primary">Guardar</button>
      </div>
      <p class="panel-modal__error" id="panel-modal-error" hidden></p>
    </div>
  </div>

  <script src="data.js?v=15"></script>
  <script type="module" src="app.js?v=18"></script>
</body>
</html>
